services:
  server:
    build: ./stomp-server-go
    # QUEUE_DB and TEST_EVENT_SEQ_FILE are opt-in: leave them unset for the
    # default in-memory queue and non-persistent demo ticker, or set them
    # (e.g. QUEUE_DB=/data/queue.sqlite3, TEST_EVENT_SEQ_FILE=/data/event-seq.txt)
    # to persist the client queues and event sequence number in /data across
    # container restarts. --queue-db is a CLI flag rather than an env var on
    # the server binary, so this wraps the command in a shell to only pass it
    # when QUEUE_DB is set.
    command: >
      sh -c 'exec stomp-server-go --port 8080 $${QUEUE_DB:+--queue-db "$$QUEUE_DB"}'
    environment:
      QUEUE_DB: /etc/data/queue.sqlite
      TEST_EVENT_SEQ_FILE: /etc/data/seq.txt
    ports:
      - "8080:8080"
    volumes:
      - db-data:/etc/data

  client:
    build: ./stomp-client
    # event-source must match whichever event source the server is actually
    # running (see the server service above): the seq-file one, since
    # TEST_EVENT_SEQ_FILE is set unconditionally there.
    command: python client.py --event-source seq-events --client-id playground-client --reconnect --log-level ${LOG_LEVEL:-INFO}
    environment:
      STOMP_URL: ws://server:8080
      CLIENT_DB: /data/client.sqlite3
      DROP_ACK_PERCENT: ${DROP_ACK_PERCENT:-0}
      DISCONNECT_AFTER: ${DISCONNECT_AFTER:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      - server

  generator:
    build: ./event-generator
    #command: python generator.py --destination /origin/demo --rate 2
    command: sleep infinity
    environment:
      STOMP_URL: ws://server:8080
      CONTROL_PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      - server

  web-ui:
    build: ./web-ui
    ports:
      - "8000:8000"
    depends_on:
      - server

  server-ui:
    build: ./server-ui
    ports:
      - "8001:8000"
    depends_on:
      - server
volumes:
  db-data:
