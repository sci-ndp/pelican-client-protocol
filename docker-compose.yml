services:
  server:
    build: ./stomp-server-go
    # QUEUE_DB, TEST_EVENT_SEQ_FILE, and WATCH_PELICAN_URL are opt-in: leave
    # them unset for the default in-memory queue and non-persistent demo
    # ticker. --queue-db/--pelican-url/--pelican-state-file are CLI flags
    # rather than env vars on the server binary, so this wraps the command
    # in a shell to only pass them when the corresponding env var is set.
    # main.go picks at most one event source, in priority order: the Pelican
    # directory watcher (which shells out to the pelican CLI baked into this
    # image) if WATCH_PELICAN_URL is set, else the persistent seq-file demo
    # source if TEST_EVENT_SEQ_FILE is set, else the plain ticker -- so with
    # WATCH_PELICAN_URL set below, TEST_EVENT_SEQ_FILE is present but
    # currently inert. Deliberately NOT prefixed with PELICAN_ (e.g.
    # PELICAN_URL, or even PELICAN_WATCH_URL): the pelican CLI itself grabs
    # every env var starting with "PELICAN_", strips that prefix, and maps
    # whatever's left to one of its own config keys, so any PELICAN_-prefixed
    # name here causes it to print spurious "Unknown configuration keys"
    # warnings on every invocation.
    command: >
      sh -c 'exec stomp-server-go --port 8080 $${QUEUE_DB:+--queue-db "$$QUEUE_DB"} $${WATCH_PELICAN_URL:+--pelican-url "$$WATCH_PELICAN_URL" --pelican-state-file "$$WATCH_PELICAN_STATE_FILE"}'
    environment:
      QUEUE_DB: /etc/data/queue.sqlite
      TEST_EVENT_SEQ_FILE: /etc/data/seq.txt
      WATCH_PELICAN_URL: osdf://vdc/public/pelican_protocol
      WATCH_PELICAN_STATE_FILE: /etc/data/pelican-seen.txt
    ports:
      - "8080:8080"
    volumes:
      - db-data:/etc/data

  client:
    build: ./stomp-client
    # --event-source is just a free-form suffix of this client's own
    # destination (<client_id>/<event-source>); the server delivers to
    # whatever destination a client subscribes to regardless of which
    # EventSource it's actually running, so this name need not match
    # anything server-side. With WATCH_PELICAN_URL set on the server above, this
    # client will receive Pelican new-file JSON events instead of seq numbers.
    command: python client.py --event-source seq-events --client-id playground-client --reconnect --log-level ${LOG_LEVEL:-INFO}
    environment:
      STOMP_URL: ws://server:8080
      CLIENT_DB: /data/client.sqlite3
      DROP_ACK_PERCENT: ${DROP_ACK_PERCENT:-0}
      DISCONNECT_AFTER: ${DISCONNECT_AFTER:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      - server

  generator:
    build: ./event-generator
    #command: python generator.py --destination /origin/demo --rate 2
    command: sleep infinity
    environment:
      STOMP_URL: ws://server:8080
      CONTROL_PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      - server

  web-ui:
    build: ./web-ui
    ports:
      - "8000:8000"
    depends_on:
      - server

  server-ui:
    build: ./server-ui
    ports:
      - "8001:8000"
    depends_on:
      - server
volumes:
  db-data:
