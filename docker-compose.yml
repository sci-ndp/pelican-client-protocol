services:
  server:
    build: ./stomp-server-go
    command: stomp-server-go --port 8080
    ports:
      - "8080:8080"

  client:
    build: ./stomp-client
    command: python client.py --destination /origin/demo --client-id playground-client --reconnect --log-level ${LOG_LEVEL:-INFO}
    environment:
      STOMP_URL: ws://server:8080
      CLIENT_DB: /data/client.sqlite3
      DROP_ACK_PERCENT: ${DROP_ACK_PERCENT:-0}
      DISCONNECT_AFTER: ${DISCONNECT_AFTER:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_PORT: 8081
    volumes:
      - client-data:/data
    ports:
      - "8081:8081"
    depends_on:
      - server

  generator:
    build: ./event-generator
    command: python generator.py --destination /origin/demo --rate 2
    environment:
      STOMP_URL: ws://server:8080
      CONTROL_PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      - server

  web-ui:
    build: ./web-ui
    ports:
      - "8000:8000"
    depends_on:
      - server

volumes:
  client-data:
      STOMP_USERNAME: ${STOMP_USERNAME:-}
      STOMP_PASSWORD: ${STOMP_PASSWORD:-}
