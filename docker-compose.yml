services:
  server:
    build: ./stomp-server-go
    command: stomp-server-go --port 8080
    ports:
      - "8080:8080"

  client:
    build: ./stomp-client
    command: python client.py --destination /origin/demo --reconnect
    environment:
      STOMP_URL: ws://server:8080
    depends_on:
      - server

  generator:
    build: ./event-generator
    command: python generator.py --destination /origin/demo --rate 2
    environment:
      STOMP_URL: ws://server:8080
      CONTROL_PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      - server

  web-ui:
    build: ./web-ui
    ports:
      - "8000:8000"
    depends_on:
      - server
