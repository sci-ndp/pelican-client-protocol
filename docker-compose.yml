services:
  server:
    build: ./stomp-server-go
    # QUEUE_DB is opt-in: leave it unset for the default in-memory queue.
    # --queue-db is a CLI flag rather than an env var on the server binary, so
    # this wraps the command in a shell to only pass it when QUEUE_DB is set.
    # WATCH_DIR selects the event source: the filesystem watcher emits an
    # event for every file created or modified under that directory (here the
    # event-data volume, mounted at /mnt/data).
    command: >
      sh -c 'exec stomp-server-go --port 8080 --watch-dir "$$WATCH_DIR" $${QUEUE_DB:+--queue-db "$$QUEUE_DB"}'
    environment:
      QUEUE_DB: /etc/data/queue.sqlite
      WATCH_DIR: /mnt/data
    ports:
      - "8080:8080"
    volumes:
      - db-data:/etc/data
      - event-data:/mnt/data

  client:
    build: ./stomp-client
    # --event-source becomes this client's subscription parameters (the
    # suffix of its destination, <client_id>/<event-source>). The filesystem
    # watcher ignores it, so every client receives every event.
    command: python client.py --event-source osdf/vdc/public/pelican_protocol --client-id playground-client --reconnect --log-level ${LOG_LEVEL:-INFO}
    environment:
      STOMP_URL: ws://server:8080
      CLIENT_DB: /data/client.sqlite3
      DROP_ACK_PERCENT: ${DROP_ACK_PERCENT:-0}
      DISCONNECT_AFTER: ${DISCONNECT_AFTER:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      - server

  generator:
    build: ./event-generator
    #command: python generator.py --destination /origin/demo --rate 2
    command: sleep infinity
    environment:
      STOMP_URL: ws://server:8080
      CONTROL_PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      - server

  web-ui:
    build: ./web-ui
    ports:
      - "8000:8000"
    depends_on:
      - server

  server-ui:
    build: ./server-ui
    ports:
      - "8001:8000"
    depends_on:
      - server
volumes:
  db-data:
  event-data:
