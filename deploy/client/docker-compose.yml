services:
  stomp-client:
    build:
      context: ../../stomp-client
    command: python client.py --destination ${DESTINATION:-/origin/demo} --reconnect --heartbeat ${HEARTBEAT_MS:-10000}
    restart: unless-stopped
    environment:
      # This must be reachable from the client VM, e.g. ws://203.0.113.10:8080.
      STOMP_URL: ${STOMP_URL:?Set STOMP_URL to the server VM WebSocket URL}

  client-ui:
    build:
      context: ../../client-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8000}:8000"
