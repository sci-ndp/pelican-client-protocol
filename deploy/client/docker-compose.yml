services:
  stomp-client:
    build:
      context: ../../stomp-client
    command: python client.py --destination ${DESTINATION:-/origin/demo} --client-id ${CLIENT_ID:-remote-client} --reconnect --heartbeat ${HEARTBEAT_MS:-10000}
    restart: unless-stopped
    environment:
      # This must be reachable from the client VM, e.g. ws://203.0.113.10:8080.
      STOMP_URL: ${STOMP_URL:?Set STOMP_URL to the server VM WebSocket URL}
      CLIENT_DB: /data/client.sqlite3
      CLIENT_ID: ${CLIENT_ID:-remote-client}
      DROP_ACK_PERCENT: ${DROP_ACK_PERCENT:-0}
      DISCONNECT_AFTER: ${DISCONNECT_AFTER:-0}
    volumes:
      - client-data:/data

  client-ui:
    build:
      context: ../../client-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8000}:8000"

volumes:
  client-data:
